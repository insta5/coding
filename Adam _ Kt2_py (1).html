<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adam | Kt2_py</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--mut:#8a8a8a;--line:#262626;--glow:rgba(255,255,255,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{background:#000}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#222 0%,#000 60%);color:var(--fg);font-family:'Cairo',system-ui,sans-serif;display:flex;justify-content:center;padding:36px 18px}
.wrap{width:100%;max-width:420px;text-align:center}
.av{position:relative;width:132px;height:132px;margin:0 auto 18px}
.av:before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(#fff,#333,#fff,#333,#fff);animation:spin 6s linear infinite;filter:blur(1px)}
.av:after{content:"";position:absolute;inset:-18px;border-radius:50%;box-shadow:0 0 50px var(--glow)}
.av img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #000}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:32px;font-weight:900;letter-spacing:1px;text-shadow:0 0 18px var(--glow);display:flex;gap:8px;align-items:center;justify-content:center}
h1 img{width:26px;height:26px;filter:drop-shadow(0 0 6px rgba(60,150,240,.7))}
.sub{color:var(--mut);margin-top:4px;font-size:15px}
.tags{display:flex;gap:8px;justify-content:center;margin:16px 0 22px;flex-wrap:wrap}
.tag{border:1px solid var(--line);background:#0c0c0c;border-radius:99px;padding:6px 14px;font-size:14px;display:flex;gap:8px;align-items:center}
.tag img{width:20px;height:20px;border-radius:50%}
.card{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#141414,#060606);color:var(--fg);text-decoration:none;text-align:right;transition:.25s}
.card:hover,.card:focus-visible{border-color:#fff;box-shadow:0 0 24px var(--glow);transform:translateY(-2px);outline:none}
.ic{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 16px var(--glow);overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.ic svg{width:28px;height:28px}
.t{flex:1;min-width:0}
.t b{display:block;font-size:17px}
.t span{color:var(--mut);font-size:13px;direction:ltr;display:inline-block}
.st{font-weight:900;font-size:20px;text-align:left;direction:ltr}
.st small{display:block;color:var(--mut);font-weight:400;font-size:11px}
@media(prefers-reduced-motion:reduce){.av:before{animation:none}.card{transition:none}}
</style></head><body><main class="wrap">
